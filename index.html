    <script>
      (function () {
        try {
          var saved = localStorage.getItem('routix-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-rose-100 selection:text-rose-900 dark:selection:bg-rose-950 dark:selection:text-rose-100">

    <script type="module" src="/src/main.tsx"></script>
  </body>
